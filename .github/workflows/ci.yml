# What a green run means: the engine tests (`npm test`, 64 tests in engine.test.js) pass on Node 24 on Ubuntu and
# macOS, and `npm run build` regenerates the committed dist/ bundle and standalone page byte for byte.
# What it does NOT cover: the browser/UI suite (browser.test.mjs) needs Playwright and a Chromium browser, which
# this project deliberately does not depend on, so it is not run in CI. The UI is therefore untested here.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node 24 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Engine tests
        run: npm test
      - name: Build, then check the committed bundle is up to date
        run: |
          npm run build
          git diff --exit-code -- dist/extreme-calculator.js dist/extreme-calculator.html
