name: Bug report or wrong result
description: The calculator gave a wrong answer, an unhelpful error, or the UI misbehaved.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The expression or steps, and the browser and Node versions.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser, Node version and OS
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Raw output
      render: text
